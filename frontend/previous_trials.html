<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Previous Tests</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Base styles --- */
    body {
      font-family: sans-serif;
      background: #f5f7fa;
      color: #222;
      padding: 0.5rem; /* minimal padding */
      margin: 0;
      display: block;
    }

    .container {
      width: 100vw;
      max-width: 100vw;
      background: #fff;
      border-radius: 0;
      box-shadow: none;
      padding: 1rem 2rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .summary-box {
      border: 2px solid #222;
      border-radius: 8px;
      padding: 12px 24px;
      background: #f8f8fa;
      font-size: 1.15em;
      width: fit-content;
      user-select: none;
      font-weight: 600;
      color: #333;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem 2rem;
      flex-wrap: wrap;
    }

    label {
      display: flex;
      flex-direction: column;
      font-weight: 600;
      font-size: 0.95rem;
      color: #555;
      user-select: none;
    }

    input[type="number"] {
      margin-top: 0.3rem;
      width: 70px;
      padding: 0.3rem 0.5rem;
      border: 2px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s ease;
    }

    input[type="number"]:focus {
      border-color: #6a9a7b;
      outline: none;
      box-shadow: 0 0 6px rgba(106,154,123,0.5);
    }

    button {
      padding: 0.5rem 1.3rem;
      background-color: #6a9a7b;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      user-select: none;
      transition: background-color 0.3s ease;
    }

    button:hover:not(:disabled) {
      background-color: #5c8668;
    }

    button:disabled {
      background-color: #a1b6a2;
      cursor: not-allowed;
    }

    #status {
      font-weight: 600;
      font-size: 1rem;
      color: #6a9a7b;
      user-select: none;
      margin-left: 1rem;
    }

    #debug-panel {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 6px;
      color: #666;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 1rem;
      max-height: 130px;
      overflow-y: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 0 6px #ddd;
      user-select: text;
    }

    #output {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      color: #444;
      font-family: monospace;
      font-size: 0.9rem;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      user-select: text;
      box-shadow: inset 0 0 6px #ddd;
      display: none;
    }

    .graph-island {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.07);
      padding: 1.25rem 1.75rem;
      margin-top: 1.25rem;
      user-select: none;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    .graph-island:hover {
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }

    .graph-island h3 {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #3b5a40;
    }

    #spreadsheet-title {
      margin-top: 1.5rem;
      font-weight: 700;
      font-size: 1rem;
      color: #444;
      user-select: none;
    }

    #spreadsheet {
      overflow-x: auto;
      max-height: 300px;
      border-radius: 6px;
      border: 1px solid #ddd;
      box-shadow: inset 0 0 6px #ddd;
    }

    table #spreadsheet-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table#spreadsheet-table th,
    table#spreadsheet-table td {
      border: 1px solid #ccc;
      padding: 4px 8px;
      text-align: right;
      white-space: nowrap;
      font-family: monospace;
      user-select: text;
    }

    table#spreadsheet-table th {
      background: #eaeaea;
      font-weight: 700;
      color: #333;
      text-align: center;
    }

    @media (max-width: 900px) {
      .container {
        width: 95%;
        padding: 1rem 1.5rem;
      }
      .controls {
        flex-direction: column;
        gap: 1rem;
      }
      label, button {
        width: 100%;
      }
      input[type="number"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div><button onclick="history.back()">Go Back</button>
</div>


</body>
</html>

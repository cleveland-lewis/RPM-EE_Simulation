<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trial Simulation</n  >
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      background: #faf8f0;
      margin: 0;
      padding: 0;
      font-family: Menlo, Monaco, Consolas, monospace;
      color: #000;
    }
    .window {
      max-width: 1200px;
      margin: 0 auto;
      background: #f8f6f1;
      border: none;
      box-shadow: none;
      min-height: 100vh;
      padding-bottom: 4rem;
    }
    .title-bar {
      width: 100%;
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      justify-content: flex-start;
      height: 56px;
      background: transparent;
      margin-bottom: 0;
      position: relative;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      padding: 14px 12px 10px 12px;
      border-radius: 6px;
      border: 1px solid #000;
      background: #faf8f0;
      margin: 16px 32px 0 0;
      z-index: 12;
      align-self: flex-start;
    }
    .hamburger:focus { outline: 2px solid #000; }
    .hamburger-bar {
      width: 22px;
      height: 2.5px;
      background: #111;
      border-radius: 2px;
    }
    .menu-dropdown {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 56px;
      right: 32px;
      min-width: 200px;
      background: #fffdf9;
      border: 1.5px solid #000;
      box-shadow: 4px 4px 0 #000;
      border-radius: 10px;
      z-index: 100;
      padding: 0.75rem 0.5rem;
      gap: 2px;
    }
    .menu-dropdown.show { display: flex !important; }
    .menu-dropdown a, .menu-dropdown button {
      color: #111;
      font-family: inherit;
      background: none;
      border: none;
      font-size: 1.09em;
      padding: 0.5em 1em;
      text-align: left;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      width: 100%;
    }
    .menu-dropdown a:hover, .menu-dropdown button:hover {
      background: #eee9db;
    }
    .main-container {
      padding: 0 3vw 2vw 3vw;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }
    .page-title {
      font-size: 2.1rem;
      font-weight: 800;
      text-align: center;
      margin-top: 2rem;
      margin-bottom: 0.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .page-sub {
      font-size: 1.07rem;
      color: #222;
      text-align: center;
      margin-bottom: 1.2rem;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1.3rem 2.5rem;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .controls label {
      font-family: inherit;
      font-size: 1em;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .controls input[type="number"] {
      width: 56px;
      margin-left: 0.3em;
      font-size: 1em;
      font-family: inherit;
      padding: 2.5px 7px;
      border: 1.1px solid #999;
      border-radius: 4px;
      background: #faf8f0;
    }
    .controls button, .controls .button {
      font-family: inherit;
      padding: 7px 18px;
      margin-right: 3px;
      background: #fffdf9;
      border: 2px solid #000;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
      transition: background 0.14s, box-shadow 0.14s;
    }
    .controls button:disabled {
      background: #eceae1;
      color: #aaa;
      border-color: #bbb;
      box-shadow: none;
      cursor: default;
    }
    .controls #status {
      margin-left: 7px;
      font-family: monospace;
      color: #236823;
      font-weight: 700;
    }
    .progress-label {
      text-align: center;
      font-size: 1.15em;
      margin-top: 10px;
      margin-bottom: 4px;
      font-family: inherit;
      letter-spacing: 0.2px;
    }
    .progress-outer {
      width: 100%;
      height: 13px;
      background: #ece8dc;
      border-radius: 7px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      border: 1.2px solid #b9b5a8;
      box-shadow: none;
    }
    .progress-inner {
      width: 0%;
      height: 100%;
      background: #111;
      border-radius: 7px 0 0 7px;
      transition: width 0.3s;
    }
    .stat-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 1.1rem;
    }
    .stat-card {
      flex: 1 1 220px;
      min-width: 220px;
      background: #fffdf9;
      border: 2.2px solid #000;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.1rem 0.5rem 1rem 0.5rem;
      margin: 0 0.1rem;
      gap: 0.2rem;
    }
    .stat-label {
      font-size: 1.04em;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #222;
      text-align: center;
      margin-bottom: 2px;
      text-transform: uppercase;
    }
    .stat-value {
      font-family: inherit;
      font-size: 2.2em;
      font-weight: 700;
      color: #000;
      text-align: center;
    }
    .collapsible {
      width: 100%;
      padding: 9px 18px;
      font-size: 1.09em;
      font-family: inherit;
      background: #faf8f0;
      border: 2px solid #000;
      border-radius: 8px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
      margin-top: 1rem;
    }
    .collapsible.active { background: #eee9db; }
    .collapsible-content {
      display: none;
      padding: 1rem 0.5rem 1.3rem 0.5rem;
      background: #fffdf9;
      border: 1.1px solid #bbb;
      border-radius: 8px;
      box-shadow: 2px 2px 0 #e7e3db;
      margin-bottom: 1rem;
    }
    .collapsible-content.active { display: block; }
    .export-bar {
      margin-bottom: 0.7rem;
      display: flex;
      gap: 0.6rem;
    }
    #debug-panel {
      margin: 2rem 0 0 0;
      padding: 0.75rem 1rem;
      background: #fcfcf3;
      border: 1.2px solid #ddd;
      font-size: 0.98em;
      font-family: inherit;
      white-space: pre-line;
      border-radius: 7px;
      min-height: 30px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    #spreadsheet-title {
      font-size: 1.3em;
      margin-top: 2.2rem;
      font-weight: 800;
      font-family: inherit;
    }
    #spreadsheet {
      background: #fff;
      border: 1.5px solid #bbb;
      border-radius: 6px;
      margin-bottom: 3rem;
      font-size: 1.02em;
      padding: 1rem;
      overflow-x: auto;
    }
    @media (max-width: 800px) {
      .main-container { padding: 0 1vw; }
      .stat-grid { flex-direction: column; gap: 1rem; }
      .stat-card { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="hamburger" id="hamburgerBtn" tabindex="0" aria-label="Open menu">
        <div class="hamburger-bar"></div>
        <div class="hamburger-bar"></div>
        <div class="hamburger-bar"></div>
      </div>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="dashboard.html">Dashboard</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
        <a href="trials.html">Trials</a>
        <a href="batch.html">Batch</a>
        <button onclick="toggleDevMode()">Toggle Dev Mode</button>
      </div>
    </div>
    <div class="main-container">
      <div class="page-title">TRIAL SIMULATION</n      </div>
      <div class="page-sub" id="sim-date"></div>
      <section class="controls">
        <label for="episodes">EPISODES
          <input id="episodes" type="number" min="1" value="2400">
        </label>
        <label for="repetitions">REPETITIONS
          <input id="repetitions" type="number" min="1" value="1">
        </label>
        <button id="runBtn">▶ Run Simulation</button>
        <button id="saveBtn" disabled>Save</button>
        <button id="downloadCSV" disabled>Export CSV</button>
        <span id="status">[waiting]</span>
      </section>
      <div class="progress-label">Simulation Progress</div>
      <div class="progress-outer">
        <div class="progress-inner" id="progressBar"></div>
      </div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">AVG. ATTUNEMENT</div>
          <div class="stat-value" id="statAttunement">0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">AVG. STRESS SCHEMA</div>
          <div class="stat-value" id="statStress">0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">CLOCK NUMBER</div>
          <div class="stat-value" id="statClock">000</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">SIMULATION UPTIME</div>
          <div class="stat-value" id="statUptime">00:00</div>
        </div>
      </div>
      <input style="margin:1.5rem 0 0.2rem 0; width:100%;font-size:1em;padding:0.65em 1em; border:1.2px solid #bbb; border-radius:7px;" readonly placeholder="ATTUNEMENT SCORE">
      <input style="margin:0.4rem 0;width:100%;font-size:1em;padding:0.65em 1em; border:1.2px solid #bbb; border-radius:7px;" readonly placeholder="SCHEMA STRESS">
      <input style="margin:0.4rem 0 1.7rem 0;width:100%;font-size:1em;padding:0.65em 1em; border:1.2px solid #bbb; border-radius:7px;" readonly placeholder="AFFECT FEEDBACK">
      <h2 id="spreadsheet-title">Raw Data Spreadsheet</h2>
      <div id="spreadsheet"></div>
    </div>
  </div>
  <script>
    // Hamburger menu logic
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const menuDropdown = document.getElementById('menuDropdown');

    function closeDropdown(e) {
      if (!menuDropdown.contains(e.target) && !hamburgerBtn.contains(e.target)) {
        menuDropdown.classList.remove('show');
        document.removeEventListener('click', closeDropdown);
      }
    }

    hamburgerBtn.onclick = function(e) {
      e.stopPropagation();
      menuDropdown.classList.toggle('show');
      if (menuDropdown.classList.contains('show')) {
        document.addEventListener('click', closeDropdown);
      } else {
        document.removeEventListener('click', closeDropdown);
      }
    };

    hamburgerBtn.onkeydown = function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        hamburgerBtn.click();
      }
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        menuDropdown.classList.remove('show');
        document.removeEventListener('click', closeDropdown);
      }
    });

    function toggleDevMode() {
      document.body.classList.toggle('dev-mode');
    }

    // Date at top
    document.addEventListener('DOMContentLoaded', function () {
      const now = new Date();
      const dateElement = document.getElementById("sim-date");
      if (dateElement) {
        dateElement.textContent = now.toDateString();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trial Simulation</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      background: #faf8f0;
      margin: 0;
      padding: 0;
      font-family: Menlo, Monaco, Consolas, monospace;
      color: #000;
    }
    .window {
      max-width: 1200px;
      margin: 0 auto;
      background: #f8f6f1;
      border: none;
      box-shadow: none;
      min-height: 100vh;
      padding-bottom: 4rem;
    }
    .title-bar {
      width: 100%;
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      justify-content: flex-start;
      height: 56px;
      background: transparent;
      margin-bottom: 0;
      position: relative;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      padding: 14px 12px 10px 12px;
      border-radius: 6px;
      border: 1px solid #000;
      background: #faf8f0;
      margin: 16px 32px 0 0;
      z-index: 12;
      align-self: flex-start;
    }
    .hamburger:focus { outline: 2px solid #000; }
    .hamburger-bar {
      width: 22px;
      height: 2.5px;
      background: #111;
      border-radius: 2px;
    }
    .menu-dropdown {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 56px;
      right: 32px;
      min-width: 200px;
      background: #fffdf9;
      border: 1.5px solid #000;
      box-shadow: 4px 4px 0 #000;
      border-radius: 10px;
      z-index: 100;
      padding: 0.75rem 0.5rem;
      gap: 2px;
    }
    .menu-dropdown.show { display: flex !important; }
    .menu-dropdown a, .menu-dropdown button {
      color: #111;
      font-family: inherit;
      background: none;
      border: none;
      font-size: 1.09em;
      padding: 0.5em 1em;
      text-align: left;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      width: 100%;
    }
    .menu-dropdown a:hover, .menu-dropdown button:hover {
      background: #eee9db;
    }
    .main-container {
      padding: 0 3vw 2vw 3vw;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }
    .page-title {
      font-size: 2.1rem;
      font-weight: 800;
      text-align: center;
      margin-top: 2rem;
      margin-bottom: 0.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .page-sub {
      font-size: 1.07rem;
      color: #222;
      text-align: center;
      margin-bottom: 1.2rem;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1.3rem 2.5rem;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .controls label {
      font-family: inherit;
      font-size: 1em;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .controls input[type="number"] {
      width: 56px;
      margin-left: 0.3em;
      font-size: 1em;
      font-family: inherit;
      padding: 2.5px 7px;
      border: 1.1px solid #999;
      border-radius: 4px;
      background: #faf8f0;
    }
    .controls button, .controls .button {
      font-family: inherit;
      padding: 7px 18px;
      margin-right: 3px;
      background: #fffdf9;
      border: 2px solid #000;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
      transition: background 0.14s, box-shadow 0.14s;
    }
    .controls button:disabled {
      background: #eceae1;
      color: #aaa;
      border-color: #bbb;
      box-shadow: none;
      cursor: default;
    }
    .controls #status {
      margin-left: 7px;
      font-family: monospace;
      color: #236823;
      font-weight: 700;
    }
    .progress-label {
      text-align: center;
      font-size: 1.15em;
      margin-top: 10px;
      margin-bottom: 4px;
      font-family: inherit;
      letter-spacing: 0.2px;
    }
    .progress-outer {
      width: 100%;
      height: 13px;
      background: #ece8dc;
      border-radius: 7px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      border: 1.2px solid #b9b5a8;
      box-shadow: none;
    }
    .progress-inner {
      width: 0%;
      height: 100%;
      background: #111;
      border-radius: 7px 0 0 7px;
      transition: width 0.3s;
    }
    .stat-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 1.1rem;
    }
    .stat-card {
      flex: 1 1 220px;
      min-width: 220px;
      background: #fffdf9;
      border: 2.2px solid #000;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.1rem 0.5rem 1rem 0.5rem;
      margin: 0 0.1rem;
      gap: 0.2rem;
    }
    .stat-label {
      font-size: 1.04em;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #222;
      text-align: center;
      margin-bottom: 2px;
      text-transform: uppercase;
    }
    .stat-value {
      font-family: inherit;
      font-size: 2.2em;
      font-weight: 700;
      color: #000;
      text-align: center;
    }
    .collapsible {
      width: 100%;
      padding: 9px 18px;
      font-size: 1.09em;
      font-family: inherit;
      background: #faf8f0;
      border: 2px solid #000;
      border-radius: 8px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
      margin-top: 1rem;
    }
    .collapsible.active { background: #eee9db; }
    .collapsible-content {
      display: none;
      padding: 1rem 0.5rem 1.3rem 0.5rem;
      background: #fffdf9;
      border: 1.1px solid #bbb;
      border-radius: 8px;
      box-shadow: 2px 2px 0 #e7e3db;
      margin-bottom: 1rem;
    }
    .collapsible-content.active { display: block; }
    .export-bar {
      margin-bottom: 0.7rem;
      display: flex;
      gap: 0.6rem;
    }
    #debug-panel {
      margin: 2rem 0 0 0;
      padding: 0.75rem 1rem;
      background: #fcfcf3;
      border: 1.2px solid #ddd;
      font-size: 0.98em;
      font-family: inherit;
      white-space: pre-line;
      border-radius: 7px;
      min-height: 30px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    #spreadsheet-title {
      font-size: 1.3em;
      margin-top: 2.2rem;
      font-weight: 800;
      font-family: inherit;
    }
    #spreadsheet {
      background: #fff;
      border: 1.5px solid #bbb;
      border-radius: 6px;
      margin-bottom: 3rem;
      font-size: 1.02em;
      padding: 1rem;
      overflow-x: auto;
    }
    @media (max-width: 800px) {
      .main-container { padding: 0 1vw; }
      .stat-grid { flex-direction: column; gap: 1rem; }
      .stat-card { min-width: 0; }
    }

    .modal-overlay {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background: rgba(30,30,30,0.42); z-index: 3000;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-content {
      background: #faf8f0;
      border: 2.5px solid #333; border-radius: 16px;
      box-shadow: 0 6px 48px #2225;
      padding: 2.3rem 2rem 2.3rem 2rem;
      width: 90vw; max-width: 480px; max-height: 90vh; overflow-y: auto;
    }
    .agent-card {
      border: 2px solid #aaa;
      border-radius: 9px;
      background: #fff;
      padding: 1rem 0.7rem 0.9rem 0.7rem;
      margin-bottom: 1.2em;
    }
    .agent-title {
      font-weight: bold; margin-bottom: 0.6em;
      font-size: 1.11em;
    }
    .agent-remove {
      float:right;
      color: #c00; background:none; border:none; cursor:pointer; font-weight:bold;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="hamburger" id="hamburgerBtn" tabindex="0" aria-label="Open menu">
        <div class="hamburger-bar"></div>
        <div class="hamburger-bar"></div>
        <div class="hamburger-bar"></div>
      </div>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="dashboard.html">Dashboard</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
        <a href="trials.html">Trials</a>
        <a href="batch.html">Batch</a>
        <button onclick="toggleDevMode()">Toggle Dev Mode</button>
      </div>
    </div>
    <div class="main-container">
      <div class="page-title">TRIAL SIMULATION</n      </div>
      <div class="page-sub" id="sim-date"></div>
      <section class="controls">
        <label for="episodes">EPISODES
          <input id="episodes" type="number" min="1" value="2400">
        </label>
        <label for="repetitions">REPETITIONS
          <input id="repetitions" type="number" min="1" value="1">
        </label>
        <button id="runBatchBtn">▶ Run Simulation</button>
        <button id="saveBtn" disabled>Save</button>
        <button id="downloadCSV" disabled>Export CSV</button>
        <button id="agentsBtn">Agents</button>
        <span id="status">[waiting]</span>
      </section>
      <div class="progress-label">Simulation Progress</div>
      <div class="progress-outer">
        <div class="progress-inner" id="progressBar"></div>
      </div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">AVG. ATTUNEMENT</div>
          <div class="stat-value" id="statAttunement">0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">AVG. STRESS SCHEMA</div>
          <div class="stat-value" id="statStress">0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">CLOCK NUMBER</div>
          <div class="stat-value" id="statClock">000</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">SIMULATION UPTIME</div>
          <div class="stat-value" id="statUptime">00:00</div>
        </div>
      </div>
      <input style="margin:1.5rem 0 0.2rem 0; width:100%;font-size:1em;padding:0.65em 1em; border:1.2px solid #bbb; border-radius:7px;" readonly placeholder="ATTUNEMENT SCORE">
      <input style="margin:0.4rem 0;width:100%;font-size:1em;padding:0.65em 1em; border:1.2px solid #bbb; border-radius:7px;" readonly placeholder="SCHEMA STRESS">
      <input style="margin:0.4rem 0 1.7rem 0;width:100%;font-size:1em;padding:0.65em 1em; border:1.2px solid #bbb; border-radius:7px;" readonly placeholder="AFFECT FEEDBACK">
      <!-- Batch jobs section -->
      <section id="jobs-section" style="margin-top:2.2rem;">
        <h2>Current Jobs</h2>
        <div id="jobs-table-container">
          <table id="jobs-table" style="width:100%;border-collapse:collapse;">
            <thead>
              <tr>
                <th style="border-bottom:1.5px solid #aaa;padding:0.4em;">Job ID</th>
                <th style="border-bottom:1.5px solid #aaa;padding:0.4em;">Status</th>
                <th style="border-bottom:1.5px solid #aaa;padding:0.4em;">Agent Progress</th>
                <th style="border-bottom:1.5px solid #aaa;padding:0.4em;">Actions</th>
              </tr>
            </thead>
            <tbody id="jobs-table-body">
              <!-- Jobs will be dynamically rendered here -->
            </tbody>
          </table>
        </div>
      </section>
      <h2 id="spreadsheet-title">Raw Data Spreadsheet</h2>
      <div id="spreadsheet"></div>
    </div>
  </div>
  <div id="agentsModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h2>Configure Agents</h2>
      <div style="margin-bottom:1em;">
        <button id="setSameParamsBtn">Set Same Parameters for All</button>
        <button id="addAgentBtn">Add Agent</button>
      </div>
      <div id="agentCards"></div>
      <div style="margin-top:1.5em;">
        <button id="saveAgentsBtn" style="font-weight:bold;">Save &amp; Close</button>
      </div>
    </div>
  </div>
  <script>
    // Hamburger menu logic
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const menuDropdown = document.getElementById('menuDropdown');

    function closeDropdown(e) {
      if (!menuDropdown.contains(e.target) && !hamburgerBtn.contains(e.target)) {
        menuDropdown.classList.remove('show');
        document.removeEventListener('click', closeDropdown);
      }
    }

    hamburgerBtn.onclick = function(e) {
      e.stopPropagation();
      menuDropdown.classList.toggle('show');
      if (menuDropdown.classList.contains('show')) {
        document.addEventListener('click', closeDropdown);
      } else {
        document.removeEventListener('click', closeDropdown);
      }
    };

    hamburgerBtn.onkeydown = function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        hamburgerBtn.click();
      }
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        menuDropdown.classList.remove('show');
        document.removeEventListener('click', closeDropdown);
      }
    });

    function toggleDevMode() {
      document.body.classList.toggle('dev-mode');
    }

    // Date at top
    document.addEventListener('DOMContentLoaded', function () {
      const now = new Date();
      const dateElement = document.getElementById("sim-date");
      if (dateElement) {
        dateElement.textContent = now.toDateString();
      }
    });

    // ==== Agent Modal Logic ====
    let agents = [
      { episodes: 2400, repetitions: 1 }
    ];

    function showAgentsModal() {
      const modal = document.getElementById("agentsModal");
      const agentCards = document.getElementById("agentCards");
      agentCards.innerHTML = "";
      agents.forEach((agent, idx) => {
        const card = document.createElement("div");
        card.className = "agent-card";
        card.innerHTML = `
          <div class="agent-title">Agent ${idx + 1}
            <button class="agent-remove" data-idx="${idx}" title="Remove Agent" ${agents.length <= 1 ? "disabled" : ""}>&times;</button>
          </div>
          <label>Episodes <input type="number" class="agent-episodes" value="${agent.episodes}" min="1" style="width:70px;"></label>
          <label style="margin-left:1em;">Repetitions <input type="number" class="agent-repetitions" value="${agent.repetitions}" min="1" style="width:60px;"></label>
        `;
        agentCards.appendChild(card);
      });
      modal.style.display = "flex";
    }

    function updateAgentsFromModal() {
      // Read values from modal into agents array
      const cards = document.querySelectorAll(".agent-card");
      agents = Array.from(cards).map(card => {
        return {
          episodes: parseInt(card.querySelector(".agent-episodes").value, 10) || 1,
          repetitions: parseInt(card.querySelector(".agent-repetitions").value, 10) || 1
        };
      });
    }

    document.getElementById("agentsBtn").onclick = function() {
      showAgentsModal();
    };
    document.getElementById("addAgentBtn").onclick = function() {
      updateAgentsFromModal();
      agents.push({ ...agents[agents.length-1] });
      showAgentsModal();
    };
    document.getElementById("setSameParamsBtn").onclick = function() {
      updateAgentsFromModal();
      if (agents.length > 1) {
        for (let i = 1; i < agents.length; ++i) {
          agents[i] = { ...agents[0] };
        }
        showAgentsModal();
      }
    };
    document.getElementById("saveAgentsBtn").onclick = function() {
      updateAgentsFromModal();
      document.getElementById("agentsModal").style.display = "none";
    };
    // Remove agent button logic (delegated)
    document.getElementById("agentCards").onclick = function(e) {
      if (e.target.classList.contains("agent-remove")) {
        const idx = parseInt(e.target.dataset.idx, 10);
        if (agents.length > 1) {
          agents.splice(idx, 1);
          showAgentsModal();
        }
      }
    };
    // Close modal on Escape key
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        document.getElementById("agentsModal").style.display = "none";
      }
    });

    // ==== Batch Jobs Logic ====
    document.addEventListener("DOMContentLoaded", function() {
      // Run Simulation button logic (was Run Batch)
      const runBatchBtn = document.getElementById("runBatchBtn");
      let lastStartedJobId = null;
      runBatchBtn.addEventListener("click", async function() {
        runBatchBtn.disabled = true;
        try {
          // POST to /batch-job with current agents config
          const resp = await fetch("/batch-job", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ agents: agents })
          });
          if (!resp.ok) throw new Error("Failed to start batch job");
          const data = await resp.json();
          lastStartedJobId = data.job_id;
        } catch (e) {
          alert("Error starting batch job: " + e.message);
        }
        runBatchBtn.disabled = false;
      });

      // Poll jobs
      async function fetchJobsAndRender() {
        try {
          const resp = await fetch("/jobs");
          if (!resp.ok) throw new Error("Failed to fetch jobs");
          const jobs = await resp.json();
          renderJobsTable(jobs);
        } catch (e) {
          // Optionally, display error
        }
      }

      function renderJobsTable(jobs) {
        const tbody = document.getElementById("jobs-table-body");
        tbody.innerHTML = "";
        if (!Array.isArray(jobs) || jobs.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 4;
          td.style.textAlign = "center";
          td.textContent = "No jobs found.";
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }
        jobs.forEach(job => {
          const tr = document.createElement("tr");
          // Job ID
          const tdId = document.createElement("td");
          tdId.textContent = job.job_id;
          tdId.style.padding = "0.35em";
          tdId.style.fontFamily = "monospace";
          tr.appendChild(tdId);
          // Status
          const tdStatus = document.createElement("td");
          tdStatus.textContent = job.status;
          tdStatus.style.padding = "0.35em";
          tr.appendChild(tdStatus);
          // Agent Progress
          const tdAgents = document.createElement("td");
          tdAgents.style.padding = "0.35em";
          if (Array.isArray(job.agent_progress)) {
            // agent_progress: [{current, total, percent, status}, ...]
            job.agent_progress.forEach((prog, idx) => {
              const label = document.createElement("div");
              label.textContent = `Agent ${idx+1}: ${prog.status || ""}`;
              label.style.fontSize = "0.98em";
              tdAgents.appendChild(label);
              const barOuter = document.createElement("div");
              barOuter.className = "progress-outer";
              barOuter.style.height = "10px";
              barOuter.style.margin = "2px 0 7px 0";
              barOuter.style.background = "#ece8dc";
              barOuter.style.width = "98%";
              const barInner = document.createElement("div");
              barInner.className = "progress-inner";
              barInner.style.height = "100%";
              barInner.style.background = "#222";
              barInner.style.width = (prog.percent != null ? prog.percent : 0) + "%";
              barInner.style.transition = "width 0.4s";
              barOuter.appendChild(barInner);
              tdAgents.appendChild(barOuter);
              // Progress text
              if (prog.current != null && prog.total != null) {
                const txt = document.createElement("span");
                txt.style.fontSize = "0.92em";
                txt.textContent = `${prog.current} / ${prog.total}`;
                tdAgents.appendChild(txt);
              }
              tdAgents.appendChild(document.createElement("br"));
            });
          } else {
            tdAgents.textContent = "-";
          }
          tr.appendChild(tdAgents);
          // Actions
          const tdActions = document.createElement("td");
          tdActions.style.padding = "0.35em";
          // Only allow actions if job is running or paused
          if (job.status === "running" || job.status === "paused") {
            // Pause/Resume
            if (job.status === "running") {
              const pauseBtn = document.createElement("button");
              pauseBtn.textContent = "Pause";
              pauseBtn.style.marginRight = "6px";
              pauseBtn.onclick = () => jobAction(job.job_id, "pause");
              tdActions.appendChild(pauseBtn);
            } else if (job.status === "paused") {
              const resumeBtn = document.createElement("button");
              resumeBtn.textContent = "Resume";
              resumeBtn.style.marginRight = "6px";
              resumeBtn.onclick = () => jobAction(job.job_id, "resume");
              tdActions.appendChild(resumeBtn);
            }
            // Cancel
            const cancelBtn = document.createElement("button");
            cancelBtn.textContent = "Cancel";
            cancelBtn.onclick = () => jobAction(job.job_id, "cancel");
            tdActions.appendChild(cancelBtn);
          } else {
            tdActions.textContent = "-";
          }
          tr.appendChild(tdActions);
          tbody.appendChild(tr);
        });
      }

      async function jobAction(job_id, action) {
        try {
          await fetch(`/job-action/${encodeURIComponent(job_id)}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ action: action })
          });
        } catch (e) {
          alert("Job action failed: " + e.message);
        }
      }

      // Poll every 5 seconds
      fetchJobsAndRender();
      setInterval(fetchJobsAndRender, 5000);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saved Simulation Logs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Success banner */
    #success-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #4caf50;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      display: none;
      z-index: 2000;
    }

    :root {
      --bg: #f4f6f7;
      --fg: #010b50;
      --card-bg: #fff;
      --card-br: 12px;
      --card-bd: 2px solid #ccc;
      --font: 'Inter', sans-serif;
    }
    body { margin: 0; padding: 2rem; background: var(--bg); color: var(--fg); font-family: var(--font); }
    h1 { margin-top: 3; font-size: 1.8rem; }
    .log-card {
      background: var(--card-bg);
      display: block;    /* full-width block for left alignment */
      border: var(--card-bd);
      border-radius: var(--card-br);
      padding: 1rem 3rem 1rem 2rem;  /* extra right padding for delete button */
      margin-bottom: 1.2rem;
      position: relative;
      min-height: 200px; /* match expanded height so cards are consistently tall */
      box-sizing: border-box;        /* include padding in width */
      width: 100%;                   /* span full container width */
    }
    /* Stack log cards vertically with space */
    #logs-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .log-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .log-header h3 { margin: 0; font-size: 1rem; font-weight: 600; }
    .log-body { margin-top: 0.8rem; display: none; }
    .log-body table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .log-body th, .log-body td { border: 1px solid #ddd; padding: 4px 6px; text-align: right; }
    .log-body th { background: #fafafa; text-align: left; }
    .summary-row span { display: inline-block; min-width: 240px; }
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: #001667;
      position: absolute;
      top: 0.8rem;
      right: 1rem;
    }
    /* Hamburger Button */
    .hamburger {
      position: fixed;
      top: 18px;
      right: 24px;
      width: 24px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      z-index: 1001;
    }
    .hamburger-bar {
      width: 24px;
      height: 2px;
      background: #000;
      margin: 3px 0;
      border-radius: 0;
      transition: transform 0.25s ease, background 0.15s ease;
    }
    /* Dropdown Panel */
    .menu-dropdown {
      display: none;
      position: fixed;
      top: 62px;
      right: 24px;
      min-width: 162px;
      border: 1.5px solid #000;
      border-radius: 6px;
      z-index: 1002;
      font-family: Menlo, Monaco, Consolas, monospace;
      padding: 0.5rem 0.75rem;
      flex-direction: column;
      gap: 0.5rem;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .menu-dropdown.show {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }
    .menu-dropdown a, .menu-dropdown button {
      display: block;
      width: 100%;
      background: none;
      border: none;
      color: #111;
      font-size: 1em;
      font-family: inherit;
      padding: 7px 10px;
      text-align: left;
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 0.01em;
      text-decoration: none;
    }
    .menu-dropdown a:hover,
    .menu-dropdown a:focus,
    .menu-dropdown button:hover,
    .menu-dropdown button:focus {
      text-decoration: underline solid #111 2px;
    }
    }
    /* Align main container flush left */
    .main-container {
      margin: 0;
      padding: 0;
    }
</style>
</head>
<body>
  <div id="success-banner">Logs saved successfully!</div>
  <!-- Hamburger & Nav copied from batch.html -->
  <div class="hamburger" id="hamburgerBtn" tabindex="0" aria-label="Open menu">
    <div class="hamburger-bar"></div>
    <div class="hamburger-bar"></div>
    <div class="hamburger-bar"></div>
  </div>
  <div class="menu-dropdown" id="menuDropdown">
    <a href="dashboard.html">Dashboard</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
    <a href="trials.html">Trials</a>
    <a href="batch.html">Batch</a>
    <a href="saved_logs.html">Saved Logs</a>
    <button onclick="toggleDevMode()">Toggle Dev Mode</button>
  </div>

  <!-- Main content wrapper -->
  <div class="main-container">
    <h1>Saved Simulation Logs</h1>
    <section id="logs-container">Loading...</section>
  </div>



  <!-- Rest of your script here -->

<script>
const API_BASE = 'http://127.0.0.1:8000';

async function fetchSavedLogs() {
  try {
    const res = await fetch(API_BASE + '/save-logs');
    if (!res.ok) throw new Error('Failed to fetch saved logs');
    const data = await res.json();
    renderLogs(Array.isArray(data) ? data : []);
  } catch (e) {
    document.getElementById('logs-container').textContent =
      'Error loading logs: ' + e.message;
  }
}

function renderLogs(logs) {
  const container = document.getElementById('logs-container');
  container.innerHTML = '';
  if (!Array.isArray(logs) || logs.length === 0) {
    container.textContent = 'No saved logs.';
    return;
  }
  logs.forEach((log, idx) => {
    const card = document.createElement('div');
    card.className = 'log-card';
    // Header
    const header = document.createElement('div');
    header.className = 'log-header';
    header.innerHTML = `
      <h3>#${idx + 1} — ${new Date(log.timestamp).toLocaleString()}</h3>
      <span>Avg Att: ${(log.summary?.avg_attunement ?? 0).toFixed(2)} |
            Avg Stress: ${(log.summary?.avg_stress ?? 0).toFixed(2)}</span>`;
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '×';
    header.appendChild(delBtn);
    delBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this saved log?')) return;
      try {
        const resp = await fetch(API_BASE + '/save-logs', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ timestamp: log.timestamp })
        });
        if (!resp.ok) throw new Error('Failed to delete');
        card.remove();
      } catch (err) {
        alert('Error deleting log: ' + err.message);
      }
    });
    card.appendChild(header);

    // Body
    const body = document.createElement('div');
    body.className = 'log-body';
    // Agents table
    if (Array.isArray(log.agents) && log.agents.length) {
      const table = document.createElement('table');
      const th = document.createElement('tr');
      th.innerHTML = `
        <th>#</th><th>Episodes</th><th>Reps</th>
        <th>sal_decay</th><th>event_rate</th>
        <th>mem_buf</th><th>mem_decay</th>`;
      table.appendChild(th);
      log.agents.forEach((a, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i+1}</td>
          <td>${a.episodes}</td>
          <td>${a.repetitions}</td>
          <td>${a.salience_decay}</td>
          <td>${a.event_rate}</td>
          <td>${a.memory_buffer_size}</td>
          <td>${a.memory_decay}</td>`;
        table.appendChild(tr);
      });
      body.appendChild(table);
    }
    // Summary row
    const summary = document.createElement('p');
    summary.className = 'summary-row';
    summary.innerHTML = `
      <strong>Entries:</strong> <span>${log.summary?.total_entries ?? '-'}</span>
      <strong>Avg Attunement:</strong> <span>${(log.summary?.avg_attunement ?? 0).toFixed(4)}</span>
      <strong>Avg Stress:</strong> <span>${(log.summary?.avg_stress ?? 0).toFixed(4)}</span>`;
    body.appendChild(summary);
    card.appendChild(body);

    // Toggle body visibility
    header.addEventListener('click', () => {
      body.style.display = body.style.display === 'none' || !body.style.display ? 'block' : 'none';
    });

    container.appendChild(card);
  });
}


// Hamburger menu logic (copied from batch.html)
const hamburgerBtn = document.getElementById('hamburgerBtn');
const menuDropdown = document.getElementById('menuDropdown');
function closeDropdown(e) {
  if (!menuDropdown.contains(e.target) && !hamburgerBtn.contains(e.target)) {
    menuDropdown.classList.remove('show');
    document.removeEventListener('click', closeDropdown);
  }
}
hamburgerBtn.onclick = function(e) {
  e.stopPropagation();
  menuDropdown.classList.toggle('show');
  if (menuDropdown.classList.contains('show')) {
    document.addEventListener('click', closeDropdown);
  } else {
    document.removeEventListener('click', closeDropdown);
  }
};
hamburgerBtn.onkeydown = function(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    hamburgerBtn.click();
  }
};
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    menuDropdown.classList.remove('show');
    document.removeEventListener('click', closeDropdown);
  }
});

// Unified load handler: show banner then fetch logs
document.addEventListener('DOMContentLoaded', () => {
  const banner = document.getElementById('success-banner');
  const params = new URLSearchParams(window.location.search);
  if (params.get('status') === 'success') {
    banner.style.display = 'block';
    setTimeout(() => { banner.style.display = 'none'; }, 15000);
  }
  fetchSavedLogs();
});
</script>
</body>
</html>
